jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # ganzen Verlauf holen, wichtig für pull

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Aggregator ausführen
        run: python aggregator.py

      - name: Remote-Änderungen holen
        run: |
          git pull --rebase

      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update Kleinanzeigen results"
          git push
