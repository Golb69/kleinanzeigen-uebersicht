<!DOCTYPE html><html lang='de'><head><meta charset='utf-8'>
<title>Kleinanzeigen Übersicht</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:16px;}
a{text-decoration:none;color:inherit;}
h1{margin-top:0;text-align:center;}
.meta-top{color:#777;font-size:.85em;margin-bottom:16px;text-align:center;}

.topic-list{
  list-style:none;
  padding:0;
  margin:0 auto 24px auto;
  max-width:900px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
}
.topic-list li{margin:0;}
.topic-list a{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#fff;
  border-radius:8px;
  padding:14px 18px;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
  font-weight:600;
  font-size:1.0em;
  text-align:center;
}
.topic-list .count{
  color:#777;
  font-weight:400;
  font-size:.85em;
  margin-top:4px;
}

.back-link{
  display:inline-block;
  margin-bottom:16px;
  color:#0a7d3c;
  font-weight:600;
}

.search-box{
  display:block;
  width:100%;
  max-width:420px;
  margin:0 auto 20px auto;
  padding:10px 14px;
  font-size:1em;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
  max-width:1100px;
  margin:0 auto 24px auto;
}
.card{
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
}
.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  background:#eee;
}
.card-body{padding:10px 12px;}
.card-title{
  font-weight:700;
  font-size:.95em;
  color:#222;
  line-height:1.3;
  margin-bottom:6px;
}
.card-price{
  color:#0a7d3c;
  font-weight:700;
  font-size:.95em;
  margin-bottom:4px;
}
.card-meta{
  color:#777;
  font-size:.8em;
  margin-top:2px;
}
</style></head><body>
<h1>Themen</h1>
<div class='meta-top'>Stand: 12.09.2026 16:03</div>
<input type='text' id='topicSearch' class='search-box' placeholder='Thema suchen…' oninput='filterTopics()' autocomplete='off'>
<ul class='topic-list' id='topicList'>
<li><a href='themen/3D - Thüringen.html'>3D - Thüringen<span class='count'>1 Anzeigen</span></a></li>
<li><a href='themen/3D - Dtl..html'>3D - Dtl.<span class='count'>226 Anzeigen</span></a></li>
</ul>

<script>
function filterTopics() {
  var q = document.getElementById('topicSearch').value.trim().toLowerCase();
  var terms = q.split(/\s+/).filter(Boolean);
  document.querySelectorAll('#topicList li').forEach(function (li) {
    var text = li.textContent.toLowerCase();
    var match = terms.every(function (t) { return text.indexOf(t) !== -1; });
    li.style.display = match ? '' : 'none';
  });
}
</script>

</body></html>
