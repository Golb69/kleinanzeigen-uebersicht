name: Kleinanzeigen Aggregator

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten
  workflow_dispatch:         # manuell startbar

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scraper ausführen
        run: |
          python aggregator.py

      - name: Änderungen committen
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add index.html themen feeds cache.json || true
          git commit -m "Automatisch aktualisierte HTML-Dateien" || echo "Keine Änderungen"
          git push
